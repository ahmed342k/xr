<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شرح حديث: أهل الذكر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<style>
  body{margin:0;min-height:100vh;color:#fff;font-family:'Tajawal',sans-serif;text-align:center;padding:14px;
    background:radial-gradient(circle at 20% 10%,#5b3df5 0,transparent 45%),radial-gradient(circle at 85% 90%,#ff4f9a 0,transparent 45%),#0a0a1f}
  canvas{width:100%;max-width:960px;aspect-ratio:16/9;border-radius:28px;box-shadow:0 20px 60px #0009,0 0 0 1px #ffffff40}
  .bar{max-width:900px;height:8px;background:#ffffff26;margin:14px auto;border-radius:6px;overflow:hidden;backdrop-filter:blur(10px)}
  #prog{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#8e7cff,#00e5ff,#ffd86b)}
  button{font:700 19px 'Tajawal',sans-serif;color:#fff;padding:13px 28px;margin:6px;border-radius:999px;cursor:pointer;
    border:1px solid #ffffff66;background:linear-gradient(180deg,#ffffff40,#ffffff14);backdrop-filter:blur(18px);
    box-shadow:0 8px 24px #0006,inset 0 1px 0 #ffffff99;transition:transform .2s}
  button:hover{transform:scale(1.06)}button:active{transform:scale(.95)}
  button.rec{background:linear-gradient(180deg,#ff6b8a99,#ff2e6355)}
  #dl{display:none;color:#9bffc4;font-size:19px}#msg{opacity:.85}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div class="bar"><div id="prog"></div></div>
<button id="play">▶ تشغيل</button>
<button id="rec" class="rec">⏺ إنشاء وتحميل الفيديو (MP4)</button>
<div><a id="dl" download="sharh-ahl-aldhikr.webm">⬇ اضغط هنا إن لم يبدأ التحميل تلقائياً</a></div>
<div id="msg"></div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=1280,H=720;
const FONT="'Tajawal','Amiri','Noto Naskh Arabic',sans-serif";
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const fade=(t,d,i=.6,o=.6)=>clamp(Math.min(t/i,(d-t)/o));
const lerp=(a,b,p)=>a+(b-a)*p, ease=p=>p*p*(3-2*p);

function glow(x,y,r,col,a=1){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col+'cc');g.addColorStop(1,col+'00');ctx.save();ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);ctx.restore();}
function bg(T,pal){ctx.fillStyle='#0a0a1f';ctx.fillRect(0,0,W,H);
  for(let i=0;i<5;i++)glow(640+Math.sin(T*.3+i*1.7)*520,360+Math.cos(T*.25+i*2.3)*300,430,pal[i%3],.75);}
function glass(x,y,w,h,r=30,tint='#ffffff',a=1){
  ctx.save();ctx.globalAlpha=a;ctx.shadowColor='#0007';ctx.shadowBlur=22;ctx.shadowOffsetY=14;
  let g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,tint+'55');g.addColorStop(1,tint+'1a');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();ctx.shadowColor='transparent';
  let s=ctx.createLinearGradient(x,y,x+w*.4,y+h);s.addColorStop(0,'#ffffffdd');s.addColorStop(.5,'#ffffff20');s.addColorStop(1,'#ffffff77');
  ctx.strokeStyle=s;ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.clip();let sh=ctx.createLinearGradient(x,y,x,y+h*.5);sh.addColorStop(0,'#ffffff40');sh.addColorStop(1,'#ffffff00');ctx.fillStyle=sh;ctx.fillRect(x,y,w,h*.5);ctx.restore();
  ctx.restore();}
function txt(s,x,y,size,col='#fff',a=1,w='700'){ctx.save();ctx.globalAlpha=a;ctx.direction='rtl';ctx.textAlign='center';ctx.font=w+' '+size+'px '+FONT;ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();}
function wrap(s,size,maxW){ctx.font='700 '+size+'px '+FONT;ctx.direction='rtl';const ws=s.split(' '),out=[];let cur='';
  for(const w of ws){const n=cur?cur+' '+w:w;if(ctx.measureText(n).width>maxW&&cur){out.push(cur);cur=w;}else cur=n;}out.push(cur);return out;}

// ---------- characters ----------
function angel(x,y,s,t,ph){const f=Math.sin(t*6+ph)*.25+.85;glow(x,y,80*s,'#ffffff',.6);
  ctx.save();ctx.translate(x,y);
  for(const sg of [-1,1]){ctx.save();ctx.scale(sg*f,1);ctx.rotate(-.45);let g=ctx.createLinearGradient(0,0,60*s,0);g.addColorStop(0,'#ffffffcc');g.addColorStop(1,'#bfe9ff33');
    ctx.fillStyle=g;ctx.strokeStyle='#ffffffaa';ctx.beginPath();ctx.ellipse(38*s,-8*s,40*s,12*s,0,0,7);ctx.fill();ctx.stroke();ctx.restore();}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,13*s,0,7);ctx.fill();
  ctx.strokeStyle='#ffe38a';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,-22*s,12*s,4*s,0,0,7);ctx.stroke();ctx.restore();}
function people(cx,cy,n,t,s=1,a=1){const arr=[];for(let i=0;i<n;i++){const an=i/n*6.283+.4;arr.push([cx+Math.cos(an)*190*s,cy+Math.sin(an)*48*s]);}
  arr.sort((p,q)=>p[1]-q[1]);ctx.save();ctx.globalAlpha=a;
  arr.forEach(([x,y],i)=>{glow(x,y-30*s,60*s,'#ffd86b',.35+.25*Math.sin(t*3+i));
    ctx.fillStyle='#ffffffee';ctx.beginPath();ctx.arc(x,y-38*s,15*s,0,7);ctx.fill();
    let g=ctx.createLinearGradient(x,y-25*s,x,y+10*s);g.addColorStop(0,'#ffffffcc');g.addColorStop(1,'#ffffff44');ctx.fillStyle=g;
    ctx.beginPath();ctx.ellipse(x,y-4*s,26*s,24*s,0,Math.PI,0);ctx.fill();});ctx.restore();}
function sparkles(t,n,x0,x1,y0,y1,col='#ffffff'){ctx.fillStyle=col;for(let i=0;i<n;i++){const x=lerp(x0,x1,(i*.6180)%1),y=y0+((i*97+(-t*40))%(y1-y0)+(y1-y0))%(y1-y0);ctx.globalAlpha=.4+.4*Math.sin(t*3+i);ctx.beginPath();ctx.arc(x,y,2+(i%3),0,7);ctx.fill();}ctx.globalAlpha=1;}

// ---------- motifs ----------
const M={
 title(t,d,T){const a=fade(t,d);sparkles(T,40,0,W,0,H);
  for(let i=0;i<6;i++)angel(160+i*190,150+Math.sin(T*2+i)*25+(i%2)*380,.9,T,i);
  glass(190,200,900,320,50,'#ffffff',a);
  txt('شرح حديث',640,300,40,'#ffe38a',a);
  txt('أهل الذكر',640,410,110,'#fff',clamp((t-.4)/.8)*fade(t,d,.1,.5),'800');
  txt('صحيح البخاري ‏(6408)',640,480,30,'#ffffffcc',clamp((t-1.4)/.8)*fade(t,d,.1,.5),'400');},
 roam(t,d,T){const p=ease(clamp((t-3)/3));sparkles(T,30,0,W,0,H);
  people(640,430,6,t,1,clamp((t-1)/1));
  for(let i=0;i<5;i++){const rx=((t*130+i*300)%1500)-110,ry=300+Math.sin(t*2+i)*50+i*10;
    const an=i/5*6.283+t*.6,tx=640+Math.cos(an)*250,ty=340+Math.sin(an)*60;angel(lerp(rx,tx,p),lerp(ry,ty,p),1,t,i);}},
 rise(t,d,T){const up=t*22;people(640,440-up,6,t,1);
  for(let i=0;i<8;i++){const an=i/8*6.283+t*.8;angel(640+Math.cos(an)*270,360-up+Math.sin(an)*70,1,t,i);}
  for(let i=0;i<4;i++){const y=((t*50+i*200)%900)-100;ctx.save();ctx.globalAlpha=.3;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse((i*377)%1200+80,y,160,34,0,0,7);ctx.fill();ctx.restore();}
  sparkles(T,45,0,W,0,H);},
 words(t,d,T){people(640,470,5,t,.8,.9);const w=['سبحان الله','الله أكبر','الحمد لله','تمجيد وتعظيم','سبحان الله','الله أكبر'];
  w.forEach((s,i)=>{const p=((t*.18+i/6)%1),x=200+(i%3)*330+Math.sin(t+i)*30,y=470-p*290;const a=Math.sin(p*3.14);
    ctx.font='700 30px '+FONT;const ww=ctx.measureText(s).width+50;glass(x-ww/2,y-26,ww,52,26,'#ffe38a',a);txt(s,x,y+10,28,'#fff',a);});},
 light(t,d,T){ctx.save();ctx.translate(640,0);for(let i=0;i<9;i++){ctx.rotate(.02);}ctx.restore();
  for(let i=-3;i<=3;i++){ctx.save();ctx.globalAlpha=.16+.08*Math.sin(t*2+i);ctx.fillStyle='#fff6c0';ctx.beginPath();ctx.moveTo(640,-20);ctx.lineTo(640+i*150-70,700);ctx.lineTo(640+i*150+70,700);ctx.fill();ctx.restore();}
  glow(640,120,200,'#fff0a0',.9);people(640,470,5,t,.8,.9);sparkles(T,35,200,1080,150,500,'#fff6c0');},
 jannah(t,d,T){glow(640,380,330,'#7dffb8',.8);
  ctx.save();ctx.beginPath();ctx.moveTo(500,500);ctx.lineTo(500,330);ctx.arc(640,330,140,Math.PI,0);ctx.lineTo(780,500);ctx.closePath();
  let g=ctx.createLinearGradient(0,190,0,500);g.addColorStop(0,'#a8ffd488');g.addColorStop(1,'#00e08a44');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#ffffffbb';ctx.lineWidth=3;ctx.stroke();ctx.restore();
  for(let i=0;i<7;i++){const x=200+i*140,y=500-((t*.3+i*.17)%1)*40;ctx.fillStyle='#3ee89a88';ctx.beginPath();ctx.arc(x,y-10,34+(i%3)*8,0,7);ctx.fill();ctx.fillStyle='#ffffff55';ctx.fillRect(x-5,y+10,10,30);}
  sparkles(T,50,0,W,0,H,'#d6ffe9');people(640,510,5,t,.55,.9);},
 fire(t,d,T){glow(640,520,420,'#ff5e3a',.7);
  for(let i=0;i<16;i++){const x=80+i*74,h=110+60*Math.sin(t*5+i*1.3)+(i%3)*30,w=40;
    let g=ctx.createLinearGradient(0,520-h,0,520);g.addColorStop(0,'#ffe27acc');g.addColorStop(.5,'#ff7a3acc');g.addColorStop(1,'#ff2e6388');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-w,520);ctx.quadraticCurveTo(x-w*.4,520-h*.5,x+Math.sin(t*6+i)*14,520-h);ctx.quadraticCurveTo(x+w*.4,520-h*.5,x+w,520);ctx.fill();}
  sparkles(T,40,0,W,150,520,'#ffd08a');people(640,420,4,t,.6,.9);},
 mercy(t,d,T){const p=clamp(t/2);glow(640,380,500*p+80,'#ffd86b',.9);
  ctx.save();ctx.translate(640,380);ctx.rotate(t*.3);for(let i=0;i<12;i++){ctx.rotate(.5236);ctx.fillStyle='#fff3b0';ctx.globalAlpha=.18;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-30,-520);ctx.lineTo(30,-520);ctx.fill();}ctx.restore();ctx.globalAlpha=1;
  for(let i=0;i<50;i++){const an=i*2.399,r=clamp(t/3)*(120+(i%7)*60);ctx.fillStyle=['#ffd86b','#ff9ecd','#8ee8ff'][i%3];ctx.globalAlpha=1-clamp(t/6);ctx.beginPath();ctx.arc(640+Math.cos(an)*r,380+Math.sin(an)*r*.7,4+(i%3),0,7);ctx.fill();}ctx.globalAlpha=1;
  people(640,430,6,t,1,1);for(let i=0;i<4;i++)angel(300+i*230,250+Math.sin(t*2+i)*20,.9,t,i);},
 card(t,d,T){const a=fade(t,d);sparkles(T,30,0,W,0,H);glass(190,90,900,540,50,'#ffffff',a);
  const rows=[['الراوي','أبو هريرة'],['المحدّث','البخاري'],['المصدر','صحيح البخاري'],['رقم الحديث','6408']];
  rows.forEach((r,i)=>{const aa=a*clamp((t-.3-i*.25)/.5);txt(r[0]+': '+r[1],640,180+i*70,42,'#fff',aa);});
  txt('خلاصة حكم المحدّث',640,480,36,'#ffe38a',a*clamp((t-1.5)/.5));
  wrap('أورده في صحيحه، وقال: رواه شعبة عن الأعمش ولم يرفعه، ورواه سهيل عن أبيه عن أبي هريرة عن النبي ﷺ',30,800).forEach((l,i)=>txt(l,640,528+i*40,30,'#ffffffdd',a*clamp((t-2)/.5),'400'));}
};

// ---------- upgraded visuals (override earlier versions) ----------
function bg(T,pal){ctx.fillStyle='#070716';ctx.fillRect(0,0,W,H);
  for(let i=0;i<5;i++)glow(640+Math.sin(T*.3+i*1.7)*520,360+Math.cos(T*.25+i*2.3)*300,430,pal[i%3],.6);
  const v=ctx.createRadialGradient(640,360,260,640,360,820);v.addColorStop(0,'#00000000');v.addColorStop(1,'#000000aa');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);}
function txt(s,x,y,size,col='#fff',a=1,w='700'){ctx.save();ctx.globalAlpha=a;ctx.direction='rtl';ctx.textAlign='center';ctx.font=w+' '+size+'px '+FONT;
  ctx.shadowColor='#000a';ctx.shadowBlur=10;ctx.shadowOffsetY=2;ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();}
function angel(x,y,s,t,ph){const u=s*1.5,f=Math.sin(t*5+ph)*.16+.9;
  glow(x,y+10*u,120*u,'#ffffff',.5);glow(x,y-30*u,50*u,'#ffe38a',.8);
  for(const sg of [-1,1]){ctx.save();ctx.translate(x,y);ctx.scale(sg,1);
    for(let k=0;k<5;k++){ctx.save();ctx.rotate((-1.3+k*.32)*f);const g=ctx.createLinearGradient(0,0,95*u,0);g.addColorStop(0,'#ffffffee');g.addColorStop(1,'#9fd8ff44');
      ctx.fillStyle=g;ctx.strokeStyle='#ffffffcc';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(50*u,0,50*u,(10-k*.5)*u,0,0,7);ctx.fill();ctx.stroke();ctx.restore();}
    ctx.restore();}
  ctx.save();ctx.beginPath();ctx.moveTo(x,y+4*u);ctx.bezierCurveTo(x+34*u,y+10*u,x+28*u,y+60*u,x+40*u,y+82*u);ctx.lineTo(x-40*u,y+82*u);ctx.bezierCurveTo(x-28*u,y+60*u,x-34*u,y+10*u,x,y+4*u);
  const g=ctx.createLinearGradient(0,y,0,y+82*u);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#a9dcff');ctx.fillStyle=g;ctx.shadowColor='#bfe9ff';ctx.shadowBlur=25;ctx.fill();ctx.restore();
  ctx.fillStyle='#fff3dc';ctx.beginPath();ctx.arc(x,y-12*u,15*u,0,7);ctx.fill();
  ctx.strokeStyle='#ffd45e';ctx.lineWidth=3.5*u;ctx.shadowColor='#ffd45e';ctx.shadowBlur=15;ctx.beginPath();ctx.ellipse(x,y-36*u,18*u,5.5*u,0,0,7);ctx.stroke();ctx.shadowBlur=0;}
function people(cx,cy,n,t,s=1,a=1){const u=s*1.5,cols=[['#2bb7a8','#127a72'],['#6c63ff','#3b34b8'],['#ff7aa8','#c53b73'],['#ffb84d','#c27a12'],['#4fa3ff','#1f64c2'],['#9b6bff','#5a35b3']];
  ctx.save();ctx.globalAlpha=a;
  glass(cx-300*s,cy-18*s,600*s,90*s,45*s,'#ffe38a',.9);
  const arr=[];for(let i=0;i<n;i++){const an=i/n*6.283+.4;arr.push([cx+Math.cos(an)*175*s,cy+10*s+Math.sin(an)*26*s,i]);}
  arr.sort((p,q)=>p[1]-q[1]);
  arr.forEach(([x,y,i])=>{const cl=cols[i%6];glow(x,y-60*u,80*u,'#ffd86b',.3+.2*Math.sin(t*3+i));
    ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y+2*u,36*u,8*u,0,0,7);ctx.fill();
    const g=ctx.createLinearGradient(0,y-62*u,0,y);g.addColorStop(0,cl[0]);g.addColorStop(1,cl[1]);
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x-34*u,y-62*u,68*u,62*u,[28*u,28*u,12*u,12*u]);ctx.fill();
    ctx.strokeStyle='#ffffff88';ctx.lineWidth=1.5;ctx.stroke();
    const lift=Math.sin(t*2+i)*4*u;ctx.fillStyle='#f0c8a0';
    for(const sg of [-1,1]){ctx.beginPath();ctx.ellipse(x+sg*30*u,y-58*u-lift,8*u,11*u,sg*.3,0,7);ctx.fill();}
    ctx.fillStyle='#f0c8a0';ctx.beginPath();ctx.arc(x,y-80*u,18*u,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y-84*u,20*u,Math.PI*1.03,Math.PI*1.97);ctx.fill();
    ctx.beginPath();ctx.roundRect(x-20*u,y-96*u,40*u,13*u,6*u);ctx.fill();ctx.strokeStyle='#ffffffaa';ctx.stroke();});
  ctx.restore();}

// ---------- scenes ----------
const scenes=[
 {d:4,m:'title',pal:['#7c5cff','#00d4ff','#ff5ca8'],L:[]},
 {d:9,m:'roam',pal:['#7c5cff','#00d4ff','#ff5ca8'],L:[[.3,'N','إن لله ملائكة يطوفون في الطرق يلتمسون أهل الذكر'],[4,'N','فإذا وجدوا قومًا يذكرون الله تنادوا: هلمّوا إلى حاجتكم']]},
 {d:6,m:'rise',pal:['#4facfe','#8e7cff','#00f2c3'],L:[[.3,'N','فيحفّونهم بأجنحتهم إلى السماء الدنيا']]},
 {d:8,m:'words',pal:['#f9d423','#ff7eb3','#7c5cff'],L:[[.3,'L','فيسألهم ربهم - وهو أعلم منهم - ما يقول عبادي؟'],[3.5,'A','يسبّحونك ويكبّرونك ويحمدونك ويمجّدونك']]},
 {d:12,m:'light',pal:['#ffd86b','#8e7cff','#00d4ff'],L:[[.3,'L','هل رأوني؟'],[2.2,'A','لا والله ما رأوك'],[4.2,'L','وكيف لو رأوني؟'],[6,'A','لو رأوك كانوا أشد لك عبادة، وأشد تمجيدًا وتحميدًا، وأكثر لك تسبيحًا']]},
 {d:11,m:'jannah',pal:['#00e08a','#00c2ff','#d6ff7a'],L:[[.3,'L','فما يسألوني؟'],[1.8,'A','يسألونك الجنة'],[3.5,'L','وهل رأوها؟'],[5,'A','لا والله يا رب ما رأوها'],[6.7,'L','فكيف لو أنهم رأوها؟'],[8.2,'A','لو رأوها كانوا أشد عليها حرصًا، وأشد لها طلبًا، وأعظم فيها رغبة']]},
 {d:11,m:'fire',pal:['#ff5e3a','#ff2e63','#ffb347'],L:[[.3,'L','فمِمَّ يتعوّذون؟'],[1.8,'A','من النار'],[3.2,'L','وهل رأوها؟'],[4.6,'A','لا والله يا رب ما رأوها'],[6.2,'L','فكيف لو رأوها؟'],[7.6,'A','لو رأوها كانوا أشد منها فرارًا، وأشد لها مخافة']]},
 {d:6,m:'mercy',pal:['#ffd86b','#ff9ecd','#8ee8ff'],L:[[.3,'L','فأُشهدكم أني قد غفرتُ لهم']]},
 {d:9,m:'rise',pal:['#7c5cff','#ffd86b','#00d4ff'],L:[[.3,'A','يقول ملَك من الملائكة: فيهم فلان ليس منهم، إنما جاء لحاجة'],[4.5,'L','هم الجلساء لا يشقى بهم جليسهم']]},
 {d:6,m:'card',pal:['#7c5cff','#00d4ff','#ff5ca8'],L:[]}
];
const total=scenes.reduce((s,x)=>s+x.d,0);

function bubbles(sc,t){
  for(const who of ['L','A','N']){let cur=null;for(const l of sc.L)if(l[1]===who&&t>=l[0])cur=l;if(!cur)continue;
    const e=ease(clamp((t-cur[0])/.6)),lines=wrap(cur[2],38,880),h=40+lines.length*54+(who==='N'?0:30);
    const y=who==='L'?50:(who==='A'?H-50-h:H-60-h);const dy=(1-e)*28*(who==='L'?-1:1);
    glass(640-470,y+dy,940,h,34,who==='L'?'#ffe38a':'#ffffff',e);
    let ty=y+dy+(who==='N'?0:30)+48;
    if(who!=='N')txt(who==='L'?'الربّ سبحانه وتعالى':'الملائكة',640,y+dy+34,22,who==='L'?'#ffe38a':'#9be7ff',e,'700');
    lines.forEach((l,i)=>txt(l,640,ty+i*54,38,'#fff',e));}}

function frame(T){let t=T,i=0;while(i<scenes.length-1&&t>=scenes[i].d){t-=scenes[i].d;i++;}
  const sc=scenes[i];ctx.clearRect(0,0,W,H);ctx.globalAlpha=1;
  bg(T,sc.pal);M[sc.m](t,sc.d,T);bubbles(sc,t);
  const f=fade(t,sc.d,.5,.5);if(f<1){ctx.fillStyle='rgba(10,10,31,'+(1-f)+')';ctx.fillRect(0,0,W,H);}
  document.getElementById('prog').style.width=(T/total*100)+'%';}

let playing=false,start=0,recording=false,recorder,chunks=[];
function loop(now){if(!playing)return;const T=(now-start)/1000;
  if(T>=total){frame(total-.01);playing=false;if(recording)setTimeout(()=>recorder.stop(),300);return;}
  frame(T);requestAnimationFrame(loop);}
async function run(){try{await document.fonts.load('700 40px Tajawal');}catch(e){}playing=true;start=performance.now();requestAnimationFrame(loop);}
document.getElementById('play').onclick=()=>{if(!recording)run();};
document.getElementById('rec').onclick=async()=>{
  if(recording)return;
  const msg=document.getElementById('msg'),dl=document.getElementById('dl');
  const cfg={codec:'avc1.640028',width:W,height:H,bitrate:8e6,framerate:30};
  let ok=false;try{ok=!!(window.VideoEncoder&&window.Mp4Muxer&&(await VideoEncoder.isConfigSupported(cfg)).supported);}catch(e){}
  if(!ok)return recordLegacy();
  recording=true;playing=false;dl.style.display='none';
  try{
    await document.fonts.load('700 40px Tajawal');
    const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:W,height:H},fastStart:'in-memory'});
    const enc=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta),error:e=>{throw e;}});
    enc.configure(cfg);
    const FPS=30,N=Math.floor(total*FPS);
    for(let i=0;i<N;i++){
      frame(i/FPS);
      const vf=new VideoFrame(c,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
      enc.encode(vf,{keyFrame:i%60===0});vf.close();
      if(i%5===0){msg.textContent='جارٍ إنشاء الفيديو... '+Math.round(i/N*100)+'%';await new Promise(r=>setTimeout(r));}
      while(enc.encodeQueueSize>8)await new Promise(r=>setTimeout(r,5));
    }
    await enc.flush();muxer.finalize();
    dl.href=URL.createObjectURL(new Blob([muxer.target.buffer],{type:'video/mp4'}));
    dl.download='sharh-ahl-aldhikr.mp4';dl.style.display='inline';dl.click();
    msg.textContent='تم إنشاء الفيديو MP4 ✔';
  }catch(e){msg.textContent='حدث خطأ: '+e.message;}
  recording=false;frame(1);
};
async function recordLegacy(){
  if(recording||!window.MediaRecorder){document.getElementById('msg').textContent='استخدم Chrome أو Edge على الحاسوب للتسجيل.';return;}
  const mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  recorder=new MediaRecorder(c.captureStream(30),{mimeType:mt,videoBitsPerSecond:8e6});chunks=[];
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{const a=document.getElementById('dl');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.style.display='inline';a.click();
    document.getElementById('msg').textContent='تم التسجيل ✔';recording=false;};
  document.getElementById('dl').style.display='none';document.getElementById('msg').textContent='جارٍ التسجيل... انتظر حتى ينتهي العرض (نحو 75 ثانية)';
  recording=true;recorder.start();run();};
document.fonts.ready.then(()=>frame(1));frame(1);
</script>
