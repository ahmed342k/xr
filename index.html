<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إعلان تصميم فيديوهات موشن 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#eef2ff;--bg2:#fbe9f6;--glass:rgba(255,255,255,.55);--line:rgba(255,255,255,.85);--tx:#171a2e;--mu:rgba(23,26,46,.62);--ac:#5b6bff;--o1:#a9b8ff;--o2:#ffb6dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0a0f24;--bg2:#1b1245;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.2);--tx:#f4f6ff;--mu:rgba(244,246,255,.62);--ac:#7c8cff;--o1:#4a3cff;--o2:#c13fa0}}
:root[data-theme="dark"]{--bg1:#0a0f24;--bg2:#1b1245;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.2);--tx:#f4f6ff;--mu:rgba(244,246,255,.62);--ac:#7c8cff;--o1:#4a3cff;--o2:#c13fa0}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Tajawal,-apple-system,system-ui,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;display:flex;justify-content:center;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:50vmax;height:50vmax;border-radius:50%;filter:blur(90px);opacity:.5;z-index:0;pointer-events:none}
body::before{background:var(--o1);top:-20vmax;right:-15vmax}
body::after{background:var(--o2);bottom:-22vmax;left:-15vmax}
.wrap{position:relative;z-index:1;width:100%;max-width:980px;padding:22px 16px 34px}
h1{margin:0 0 4px;font-size:clamp(1.4rem,4.5vw,2rem);font-weight:800}
.sub{margin:0 0 18px;color:var(--mu);font-size:.95rem}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border-radius:28px;box-shadow:0 20px 60px rgba(20,20,60,.18),inset 0 1px 0 rgba(255,255,255,.4)}
.stage{padding:10px;position:relative}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:20px;background:#0b1020;cursor:pointer}
.big{position:absolute;inset:10px;display:grid;place-items:center;pointer-events:none;transition:opacity .3s}
.big span{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.ctrl{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-top:14px}
.btn{border:1px solid var(--line);font:inherit;font-weight:700;color:var(--tx);cursor:pointer;border-radius:999px;background:var(--glass);padding:10px 18px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.ic{width:44px;height:44px;padding:0;flex:none}
input[type=range]{flex:1;accent-color:var(--ac);min-width:0}
.tm{font-size:.85rem;color:var(--mu);direction:ltr;flex:none}
.dl{width:100%;margin-top:14px;padding:17px;font-size:1.1rem;font-weight:800;color:#fff;border:0;border-radius:22px;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--ac),#b07cff);box-shadow:0 14px 34px rgba(100,100,255,.35);transition:transform .15s,opacity .2s}
.dl:active{transform:scale(.98)}.dl:disabled{opacity:.6;cursor:wait}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:14px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),#ff7ac8)}
.st{margin:10px 4px 0;color:var(--mu);font-size:.9rem;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>إعلان تصميم فيديوهات موشن شبه 3D</h1>
  <p class="sub">يُرسم الإعلان مباشرةً داخل المتصفح، ويمكنك تحميله بدقة 4K.</p>

  <div class="glass stage">
    <canvas id="cv"></canvas>
    <div class="big" id="big"><span>▶</span></div>
  </div>

  <div class="glass ctrl">
    <button class="btn ic" id="pp" aria-label="تشغيل / إيقاف">❚❚</button>
    <input type="range" id="prog" min="0" max="1000" value="0">
    <span class="tm" id="tm">00:00 / 00:24</span>
    <button class="btn" id="shuf">🎲 نماذج جديدة</button>
  </div>

  <button class="dl" id="dl">⬇ تحميل الفيديو 4K (3840×2160)</button>
  <div class="bar" id="bar"><i id="bi"></i></div>
  <p class="st" id="st">نصيحة: استخدم Chrome أو Edge على الحاسوب لأفضل نتيجة. أبقِ التبويب مفتوحاً أثناء التصوير (نحو 24 ثانية).</p>
</div>

<script>
const T=24,cv=document.getElementById('cv'),cx=cv.getContext('2d'),$=id=>document.getElementById(id);
cv.width=1920;cv.height=1080;
['700','800'].forEach(w=>document.fonts.load(w+' 40px Tajawal','تصميم'));
const NAMES=['لوغو متحرك','إعلان منتج','إنترو يوتيوب','ريلز وتيك توك','عرض تطبيق','هوية بصرية','فيديو عقاري','إعلان مطعم'];
let S=1,samples=[],bg=[];
const col=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=v=>{v=cl(v);return v*v*(3-2*v)};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- 3D-style objects ---------- */
function sphere(c,x,y,r,h){c.save();c.translate(x,y);
  c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(0,r*1.3,r*.9,r*.2,0,0,7);c.fill();
  const g=c.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r*1.05);
  g.addColorStop(0,col(h,90,84));g.addColorStop(.45,col(h,80,60));g.addColorStop(1,col(h+30,80,26));
  c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,7);c.fill();
  c.fillStyle='rgba(255,255,255,.38)';c.beginPath();c.ellipse(-r*.35,-r*.45,r*.28,r*.15,-.6,0,7);c.fill();c.restore()}
function cube(c,x,y,s,h,t,p){
  const ax=t*.8+p,ay=t*1.1+p*2,ca=Math.cos(ax),sa=Math.sin(ax),cb=Math.cos(ay),sb=Math.sin(ay),R=[];
  for(let i=0;i<8;i++){const a=i&1?1:-1,b=i&2?1:-1,d=i&4?1:-1,y1=b*ca-d*sa,z1=b*sa+d*ca;R.push([a*cb+z1*sb,y1,-a*sb+z1*cb])}
  const F=[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];
  const fs=F.map(f=>{const P=f.map(i=>R[i]),m=[0,1,2].map(k=>P.reduce((a,q)=>a+q[k],0)/4);return{P,m}}).sort((a,b)=>a.m[2]-b.m[2]);
  c.save();c.translate(x,y);c.lineJoin='round';
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(0,s*2.2,s*1.2,s*.25,0,0,7);c.fill();
  fs.forEach(({P,m})=>{const L=Math.max(0,-m[0]*.45-m[1]*.7+m[2]*.55),k=col(h,75,28+46*L);
    c.fillStyle=k;c.strokeStyle=k;c.lineWidth=s*.22;c.beginPath();
    P.forEach((q,i)=>{const f=1/(1-q[2]*.12);i?c.lineTo(q[0]*s*f,q[1]*s*f):c.moveTo(q[0]*s*f,q[1]*s*f)});
    c.closePath();c.fill();c.stroke();c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=2;c.stroke()});
  c.restore()}
function ring(c,x,y,r,h,t,p){c.save();c.translate(x,y);c.rotate(t*.4+p);c.scale(1,Math.max(.3,Math.abs(Math.cos(t*.7+p))));
  const g=c.createLinearGradient(-r,-r,r,r);g.addColorStop(0,col(h,90,80));g.addColorStop(.5,col(h,80,56));g.addColorStop(1,col(h+40,80,30));
  c.strokeStyle=g;c.lineWidth=r*.4;c.beginPath();c.arc(0,0,r,0,7);c.stroke();
  c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=r*.06;c.beginPath();c.arc(0,0,r*1.12,3.4,5);c.stroke();c.restore()}
function pill(c,x,y,s,h,t,p){c.save();c.translate(x,y);c.rotate(Math.sin(t*.6+p)*.6+p);
  const w=s*1.9,q=s*.8,g=c.createLinearGradient(0,-q/2,0,q/2);
  g.addColorStop(0,col(h,90,76));g.addColorStop(.55,col(h,80,54));g.addColorStop(1,col(h+30,80,30));
  c.fillStyle=g;c.beginPath();c.roundRect(-w/2,-q/2,w,q,q/2);c.fill();
  c.fillStyle='rgba(255,255,255,.32)';c.beginPath();c.roundRect(-w/2+q*.3,-q/2+q*.12,w-q*.6,q*.2,q*.1);c.fill();c.restore()}
function obj(c,o,w,h,t){const y=o.y*h+Math.sin(t*o.sp+o.p)*14,x=o.x*w+Math.cos(t*o.sp*.7+o.p)*8,s=62*o.z;
  if(o.k=='sphere')sphere(c,x,y,s,o.h);else if(o.k=='cube')cube(c,x,y,s*.8,o.h,t*o.sp,o.p);
  else if(o.k=='ring')ring(c,x,y,s,o.h,t,o.p);else pill(c,x,y,s,o.h,t,o.p)}

/* ---------- random samples ---------- */
function mk(seed,hue,n,hero){const r=rng(seed),K=['sphere','cube','ring','pill'],o=[];
  for(let i=0;i<n;i++)o.push({k:K[r()*4|0],x:.1+.8*r(),y:.14+.72*r(),z:.55+r()*.7,h:hue+(r()-.5)*100,p:r()*6.28,sp:.5+r()});
  if(hero)o[0]={...o[0],k:K[r()*3|0],x:.5,y:.5,z:1.9};return o}
function shuffle(){const p=[...NAMES].sort(()=>Math.random()-.5).slice(0,3),H=[210,285,160,20,330,45];
  samples=p.map(n=>{const h=H[Math.random()*6|0];return{n,bgh:h,o:mk(Math.random()*1e9|0,h,9,true)}});bg=mk(777,250,10,false)}
function scene(c,w,h,sm,t){
  let g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,col(sm.bgh,65,30));g.addColorStop(1,col(sm.bgh+60,70,12));c.fillStyle=g;c.fillRect(0,0,w,h);
  g=c.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);g.addColorStop(0,col(sm.bgh,90,60,.35));g.addColorStop(1,col(sm.bgh,90,60,0));c.fillStyle=g;c.fillRect(0,0,w,h);
  [...sm.o].sort((a,b)=>a.z-b.z).forEach(o=>obj(c,o,w,h,t));
  const sx=((t*.3)%1.8-.4)*w;g=c.createLinearGradient(sx-150,0,sx+150,h*.3);
  g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,w,h)}

/* ---------- glass + text helpers ---------- */
function glass(c,x,y,w,h,r){c.save();c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=50*S;c.shadowOffsetY=20*S;
  const g=c.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'rgba(255,255,255,.22)');g.addColorStop(1,'rgba(255,255,255,.07)');
  c.fillStyle=g;c.beginPath();c.roundRect(x,y,w,h,r);c.fill();c.shadowColor='transparent';
  c.strokeStyle='rgba(255,255,255,.32)';c.lineWidth=2;c.stroke();
  c.strokeStyle='rgba(255,255,255,.14)';c.beginPath();c.roundRect(x+4,y+4,w-8,h-8,r-4);c.stroke();c.restore()}
function txt(c,s,x,y,sz,w,fill,d='rtl'){c.save();c.font=`${w} ${sz}px Tajawal,system-ui,sans-serif`;c.textAlign='center';c.textBaseline='middle';c.direction=d;c.fillStyle=fill;c.fillText(s,x,y);c.restore()}
function ig(c,x,y,s){c.save();c.translate(x,y);const g=c.createLinearGradient(-s,s,s,-s);
  [[0,'#feda75'],[.25,'#fa7e1e'],[.5,'#d62976'],[.75,'#962fbf'],[1,'#4f5bd5']].forEach(a=>g.addColorStop(a[0],a[1]));
  c.fillStyle=g;c.beginPath();c.roundRect(-s,-s,s*2,s*2,s*.55);c.fill();
  c.strokeStyle='#fff';c.lineWidth=s*.14;c.beginPath();c.roundRect(-s*.58,-s*.58,s*1.16,s*1.16,s*.34);c.stroke();
  c.beginPath();c.arc(0,0,s*.28,0,7);c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(s*.4,-s*.4,s*.08,0,7);c.fill();c.restore()}

/* ---------- master timeline (24s) ---------- */
function render(c,t){
  S=c.canvas.width/1920;c.setTransform(S,0,0,S,0,0);c.globalAlpha=1;
  let g=c.createLinearGradient(0,0,1920,1080);g.addColorStop(0,'#0a0f24');g.addColorStop(1,'#1b1245');c.fillStyle=g;c.fillRect(0,0,1920,1080);
  [[.2,.3,260],[.8,.7,200],[.6,.2,320]].forEach((q,i)=>{const x=(q[0]+Math.sin(t*.3+i*2)*.08)*1920,y=(q[1]+Math.cos(t*.25+i)*.08)*1080;
    const r=c.createRadialGradient(x,y,0,x,y,620);r.addColorStop(0,col(q[2],80,55,.38));r.addColorStop(1,col(q[2],80,55,0));c.fillStyle=r;c.fillRect(0,0,1920,1080)});
  const vi=ease(t)*(1-ease((t-4.3)/.7)),vo=ease((t-19.2)/.9),mid=t>=4.3&&t<19.2?0:1;
  c.globalAlpha=.22+.78*Math.max(t<5?vi:0,vo,t<4.3?1:0)*(mid||1);
  bg.forEach(o=>obj(c,o,1920,1080,t));c.globalAlpha=1;

  if(t<5.2){c.save();c.globalAlpha=vi;c.translate(960,540+(1-vi)*40);const k=.94+.06*vi;c.scale(k,k);
    glass(c,-600,-210,1200,420,64);
    txt(c,'تصميم فيديوهات موشن غرافيك',0,-95,76,800,'#fff');
    txt(c,'بأسلوب شبه ثلاثي الأبعاد فخم',0,10,56,700,'#c9d2ff');
    txt(c,'دقة 4K · تفاصيل احترافية · حركة سلسة',0,110,36,400,'rgba(255,255,255,.7)');c.restore()}

  const hd=ease((t-4.8)/.5)*(1-ease((t-18.6)/.5));
  if(hd>0){c.save();c.globalAlpha=hd;glass(c,-250+960,50,500,66,33);txt(c,'نماذج عشوائية من أعمالنا',960,83,32,700,'#fff');c.restore()}

  for(let i=0;i<3;i++){const st=5+i*4.7,u=(t-st)/4.7;if(u<0||u>1)continue;
    const a=Math.min(ease(u/.14),ease((1-u)/.14)),w=1180,h=640;
    c.save();c.globalAlpha=a;c.translate(960,500+(1-a)*50*(u<.5?1:-1));const k=.9+.1*a;c.scale(k,k);
    c.save();c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=70*S;c.shadowOffsetY=30*S;c.fillStyle='#000';c.beginPath();c.roundRect(-w/2,-h/2,w,h,56);c.fill();c.restore();
    c.save();c.beginPath();c.roundRect(-w/2,-h/2,w,h,56);c.clip();c.translate(-w/2,-h/2);scene(c,w,h,samples[i],t);c.restore();
    c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=3;c.beginPath();c.roundRect(-w/2,-h/2,w,h,56);c.stroke();
    glass(c,-270,h/2+30,540,84,42);txt(c,`نموذج ${i+1} · ${samples[i].n}`,0,h/2+72,38,700,'#fff');c.restore()}

  if(t>19){c.save();c.globalAlpha=vo;c.translate(960,540+(1-vo)*40);
    glass(c,-620,-260,1240,520,64);
    txt(c,'جاهز نحوّل فكرتك إلى فيديو فخم؟',0,-140,72,800,'#fff');
    txt(c,'للتواصل وطلب التصميم عبر إنستغرام',0,-50,44,400,'rgba(255,255,255,.72)');
    c.save();const pk=1+.02*Math.sin(t*3);c.translate(0,70);c.scale(pk,pk);
    glass(c,-310,-65,620,130,65);ig(c,-215,0,44);txt(c,'@_1w8z',50,4,68,800,'#fff','ltr');c.restore();
    txt(c,'تصاميم موشن 3D · دقة 4K',0,200,32,400,'rgba(255,255,255,.6)');c.restore()}

  const f=Math.max(1-t/.6,(t-23.3)/.7,0);
  if(f>0){c.fillStyle=`rgba(8,10,26,${cl(f)})`;c.fillRect(0,0,1920,1080)}}

/* ---------- player ---------- */
let t=0,playing=true,last=performance.now(),rec=false;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
function setPlay(v){playing=v;$('pp').textContent=v?'❚❚':'▶';$('big').style.opacity=v?0:1}
function tick(n){const d=Math.min(.1,(n-last)/1000);last=n;
  if(!rec){if(playing){t+=d;if(t>=T)t=0}render(cx,t);$('prog').value=t/T*1000;$('tm').textContent=fmt(t)+' / '+fmt(T)}
  requestAnimationFrame(tick)}
$('pp').onclick=cv.onclick=()=>setPlay(!playing);
$('prog').oninput=e=>{t=e.target.value/1000*T};
$('shuf').onclick=()=>{shuffle();t=5;setPlay(true)};

/* ---------- 4K export ---------- */
$('dl').onclick=async()=>{
  const st=$('st'),bar=$('bar'),bi=$('bi'),btn=$('dl');
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){st.textContent='المتصفح لا يدعم التصوير. جرّب Chrome أو Edge.';return}
  const oc=document.createElement('canvas');oc.width=3840;oc.height=2160;const o2=oc.getContext('2d');
  const mt=['video/mp4;codecs=avc1.640033','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));
  const r=new MediaRecorder(oc.captureStream(30),{mimeType:mt,videoBitsPerSecond:45e6}),ch=[];
  r.ondataavailable=e=>e.data.size&&ch.push(e.data);
  r.onstop=()=>{const b=new Blob(ch,{type:mt.split(';')[0]}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='motion-3d-ad-4k.'+(mt.includes('mp4')?'mp4':'webm');document.body.appendChild(a);a.click();a.remove();
    st.textContent='تم تجهيز الفيديو وتحميله ✓ ('+(b.size/1048576).toFixed(0)+' MB)';btn.disabled=false;bar.style.display='none';rec=false};
  rec=true;btn.disabled=true;bar.style.display='block';st.textContent='جارٍ تصوير الفيديو بدقة 4K… أبقِ هذه الصفحة ظاهرة.';
  const t0=performance.now();r.start(1000);
  (function loop(){const tt=(performance.now()-t0)/1000;
    if(tt>=T){render(o2,T-.01);setTimeout(()=>r.stop(),400);return}
    render(o2,tt);bi.style.width=(tt/T*100)+'%';requestAnimationFrame(loop)})()};

shuffle();requestAnimationFrame(tick);
</script>
</body>
</html>
