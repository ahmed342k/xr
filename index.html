<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XR Store</title>
  <meta name="description" content="XR Store" />
  <style>
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    :root{
      --bg:#f4f7fb;
      --surface:#ffffff;
      --surface-2:#f8fbff;
      --text:#101828;
      --muted:#667085;
      --line:#e6eaf0;
      --blue:#1e6eea;
      --blue-soft:#eaf2ff;
      --green:#22c55e;
      --shadow:0 10px 30px rgba(16,24,40,.08);
    }

    body.dark{
      --bg:#0c1320;
      --surface:#121c2d;
      --surface-2:#162235;
      --text:#f4f7fb;
      --muted:#98a7be;
      --line:#24344d;
      --blue:#4c8dff;
      --blue-soft:#1a2b48;
      --shadow:0 12px 34px rgba(0,0,0,.35);
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    button,input{
      font:inherit;
      outline:none;
    }

    svg{
      width:22px;
      height:22px;
      fill:none;
      stroke:currentColor;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .container{
      width:min(1100px, calc(100% - 18px));
      margin:auto;
    }

    .site-header{
      position:sticky;
      top:0;
      z-index:10;
      background:rgba(244,247,251,.88);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
    }

    body.dark .site-header{
      background:rgba(12,19,32,.88);
    }

    .topbar{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      padding:14px 0;
      gap:10px;
    }

    .icon-btn{
      width:46px;
      height:46px;
      border:none;
      border-radius:16px;
      background:var(--surface);
      color:var(--text);
      display:grid;
      place-items:center;
      box-shadow:var(--shadow);
      position:relative;
      cursor:pointer;
    }

    .cart-btn{
      justify-self:start;
    }

    .cart-btn span{
      position:absolute;
      top:-6px;
      left:-6px;
      min-width:22px;
      height:22px;
      border-radius:999px;
      background:var(--green);
      color:#fff;
      display:grid;
      place-items:center;
      padding:0 5px;
      font-size:12px;
      font-weight:700;
    }

    .brand{
      text-align:center;
      line-height:1;
    }

    .brand-main{
      font-size:54px;
      font-weight:900;
      letter-spacing:.02em;
      color:var(--blue);
    }

    .brand-sub{
      margin-top:4px;
      font-size:13px;
      font-weight:800;
      color:var(--muted);
      letter-spacing:.28em;
    }

    .theme-switch{
      justify-self:end;
      width:84px;
      height:42px;
      border:none;
      background:transparent;
      padding:0;
      cursor:pointer;
    }

    .switch-track{
      width:100%;
      height:100%;
      display:block;
      background:#f2c300;
      border-radius:999px;
      position:relative;
      box-shadow:var(--shadow);
    }

    .switch-thumb{
      position:absolute;
      top:4px;
      right:4px;
      width:34px;
      height:34px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 6px 16px rgba(0,0,0,.18);
      transition:.22s ease;
    }

    body.dark .switch-track{
      background:#5b87ff;
    }

    body.dark .switch-thumb{
      right:46px;
    }

    .search-wrap{
      padding:0 0 14px;
    }

    .search-box{
      display:grid;
      grid-template-columns:50px 1fr;
      gap:10px;
      align-items:center;
    }

    .search-btn{
      width:50px;
      height:50px;
      border:none;
      border-radius:16px;
      background:var(--blue);
      color:#fff;
      box-shadow:var(--shadow);
      cursor:pointer;
    }

    .search-box input{
      width:100%;
      height:50px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--surface);
      color:var(--text);
      padding:0 16px;
    }

    .search-status{
      margin-top:8px;
      font-size:14px;
      font-weight:700;
      color:var(--muted);
    }

    .main-content{
      padding:18px 0 28px;
    }

    .hero{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:16px;
      background:linear-gradient(135deg,var(--surface),var(--surface-2));
      border:1px solid var(--line);
      border-radius:28px;
      padding:24px;
      box-shadow:var(--shadow);
    }

    .hero-mini{
      margin:0 0 12px;
      color:var(--muted);
      font-weight:800;
    }

    .hero h1{
      margin:0;
      font-size:clamp(34px, 6vw, 58px);
      line-height:1.15;
    }

    .hero p:last-child{
      margin:16px 0 0;
      color:var(--muted);
      line-height:1.9;
      font-size:18px;
    }

    .hero-art{
      position:relative;
      min-height:220px;
    }

    .shape{
      position:absolute;
      border-radius:26px;
      background:linear-gradient(135deg, rgba(30,110,234,.24), rgba(30,110,234,.08));
    }

    .s1{
      width:230px;
      height:140px;
      right:10px;
      bottom:12px;
      transform:rotate(-12deg);
    }

    .s2{
      width:280px;
      height:150px;
      left:8px;
      bottom:0;
    }

    .s3{
      width:180px;
      height:100px;
      right:90px;
      top:18px;
    }

    .section{
      margin-top:28px;
    }

    .section-head h2{
      margin:0 0 8px;
      font-size:36px;
      font-weight:900;
    }

    .section-head p{
      margin:0;
      color:var(--muted);
    }

    .categories{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
      margin-top:16px;
    }

    .category-btn{
      min-height:58px;
      border:none;
      border-radius:18px;
      background:var(--surface);
      color:var(--text);
      box-shadow:var(--shadow);
      font-weight:800;
      cursor:pointer;
    }

    .category-btn.active{
      background:var(--blue);
      color:#fff;
    }

    .products{
      margin-top:16px;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .product{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:22px;
      padding:12px;
      box-shadow:var(--shadow);
    }

    .product-image{
      aspect-ratio:1/1;
      border-radius:18px;
      overflow:hidden;
      background:var(--surface-2);
    }

    .product img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .product h3{
      font-size:20px;
      line-height:1.5;
      margin:12px 0 8px;
    }

    .meta{
      color:var(--muted);
      font-size:14px;
      margin-bottom:10px;
    }

    .price{
      font-size:22px;
      font-weight:900;
      color:var(--blue);
    }

    .product button{
      margin-top:12px;
      width:100%;
      min-height:46px;
      border:none;
      border-radius:14px;
      background:var(--blue);
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:22px;
      transform:translateX(-50%) translateY(20px);
      background:#16a34a;
      color:#fff;
      padding:12px 16px;
      border-radius:14px;
      font-weight:700;
      box-shadow:0 12px 24px rgba(0,0,0,.18);
      opacity:0;
      pointer-events:none;
      transition:.22s ease;
      z-index:50;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    @media (max-width:720px){
      .brand-main{
        font-size:44px;
      }

      .hero{
        grid-template-columns:1fr;
        padding:18px;
      }

      .hero p:last-child{
        font-size:16px;
      }

      .categories{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      .section-head h2{
        font-size:30px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container topbar">
      <button class="icon-btn cart-btn" aria-label="السلة">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 5h2l2.1 9.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 8H7"></path>
          <circle cx="10" cy="19" r="1.5"></circle>
          <circle cx="18" cy="19" r="1.5"></circle>
        </svg>
        <span id="cartCount">0</span>
      </button>

      <div class="brand">
        <div class="brand-main">XR</div>
        <div class="brand-sub">STORE</div>
      </div>

      <button class="theme-switch" id="themeBtn" aria-label="تبديل الوضع">
        <span class="switch-track">
          <span class="switch-thumb"></span>
        </span>
      </button>
    </div>

    <div class="container search-wrap">
      <div class="search-box">
        <button class="search-btn" aria-label="بحث">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="M20 20l-4.2-4.2"></path>
          </svg>
        </button>
        <input id="searchInput" type="text" placeholder="ابحث عن منتج..." />
      </div>
      <div class="search-status" id="searchStatus">يعرض كل المنتجات</div>
    </div>
  </header>

  <main class="container main-content">
    <section class="hero">
      <div class="hero-text">
        <p class="hero-mini">XR عروض</p>
        <h1>خصومات وعروض مميزة</h1>
        <p>واجهة مرتبة وسريعة كبداية، جاهزة حتى ترفعها على GitHub وتشوفها مباشرة.</p>
      </div>
      <div class="hero-art">
        <div class="shape s1"></div>
        <div class="shape s2"></div>
        <div class="shape s3"></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>الأقسام</h2>
        <p>اختر القسم الذي تريد.</p>
      </div>

      <div class="categories" id="categories">
        <button class="category-btn active" data-category="all">كل الأقسام</button>
        <button class="category-btn" data-category="accessories">الإكسسوارات</button>
        <button class="category-btn" data-category="electronics">الأجهزة الإلكترونية</button>
        <button class="category-btn" data-category="home">الأدوات المنزلية</button>
        <button class="category-btn" data-category="office">المستلزمات المكتبية</button>
        <button class="category-btn" data-category="smart">الأجهزة الذكية</button>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>المنتجات</h2>
        <p>نسخة جاهزة للرفع والتجربة.</p>
      </div>
      <div class="products" id="products"></div>
    </section>
  </main>

  <div class="toast" id="toast">تمت إضافة المنتج</div>

  <script>
    const themeBtn = document.getElementById('themeBtn');
    const productsContainer = document.getElementById('products');
    const cartCount = document.getElementById('cartCount');
    const searchInput = document.getElementById('searchInput');
    const searchStatus = document.getElementById('searchStatus');
    const categoryButtons = document.querySelectorAll('.category-btn');
    const toast = document.getElementById('toast');

    let cart = 0;
    let activeCategory = 'all';

    const products = [
      {
        name: 'سماعات لاسلكية',
        price: 149,
        category: 'accessories',
        image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=900&q=80'
      },
      {
        name: 'ساعة ذكية',
        price: 599,
        category: 'smart',
        image: 'https://images.unsplash.com/photo-1546868871-7041f2a55e12?auto=format&fit=crop&w=900&q=80'
      },
      {
        name: 'ماوس ألعاب',
        price: 299,
        category: 'electronics',
        image: 'https://images.unsplash.com/photo-1527814050087-3793815479db?auto=format&fit=crop&w=900&q=80'
      },
      {
        name: 'زجاجة مياه',
        price: 45,
        category: 'home',
        image: 'https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=900&q=80'
      }
    ];

    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });

    function showToast(message){
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1300);
    }

    function addToCart() {
      cart += 1;
      cartCount.textContent = cart;
      showToast('تمت إضافة المنتج');
    }

    function renderProducts() {
      const term = searchInput.value.trim().toLowerCase();

      const filtered = products.filter((p) => {
        const matchCategory = activeCategory === 'all' || p.category === activeCategory;
        const matchSearch = p.name.toLowerCase().includes(term);
        return matchCategory && matchSearch;
      });

      productsContainer.innerHTML = '';

      filtered.forEach((p) => {
        const card = document.createElement('div');
        card.className = 'product';
        card.innerHTML = `
          <div class="product-image">
            <img src="${p.image}" alt="${p.name}">
          </div>
          <h3>${p.name}</h3>
          <div class="meta">منتج تجريبي للنسخة الأولى</div>
          <div class="price">${p.price} ر.س</div>
          <button>أضف للطلب</button>
        `;

        card.querySelector('button').addEventListener('click', addToCart);
        productsContainer.appendChild(card);
      });

      searchStatus.textContent = \`يعرض \${filtered.length} منتج\`;
    }

    categoryButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        categoryButtons.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.category;
        renderProducts();
      });
    });

    searchInput.addEventListener('input', renderProducts);

    renderProducts();
  </script>
</body>
</html>
