<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل دخول الأدمن - XR</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <h1>تسجيل دخول الأدمن</h1>
    <p>الدخول مسموح فقط للإيميلات المحددة داخل لوحة الإدارة.</p>

    <div class="field">
      <label for="email">الإيميل</label>
      <input type="email" id="email" placeholder="example@gmail.com" />
    </div>

    <div class="field">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" placeholder="********" />
    </div>

    <div class="admin-actions">
      <button class="admin-btn" id="loginBtn">تسجيل الدخول</button>
      <a href="index.html" class="admin-btn-light">العودة للمتجر</a>
    </div>

    <p id="loginMsg" style="margin-top:14px;color:#ef4444;font-weight:800;"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCMvjw8Pv_ixcecNYxsokBOAdjwCJvDnig",
      authDomain: "xr-store-20583.firebaseapp.com",
      projectId: "xr-store-20583",
      storageBucket: "xr-store-20583.firebasestorage.app",
      messagingSenderId: "967462689229",
      appId: "1:967462689229:web:71b44aa4ec33253d6dcc84",
      measurementId: "G-79KCXRRXS2"
    };

    const ADMIN_EMAILS = [
      "ohkvchnjvbnb@gmail.com",
      "raedhammd22@gmail.com"
    ];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const loginMsg = document.getElementById("loginMsg");

    onAuthStateChanged(auth, (user) => {
      if (user && ADMIN_EMAILS.includes((user.email || "").toLowerCase())) {
        window.location.href = "admin.html";
      }
    });

    loginBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value.trim();

      loginMsg.textContent = "";

      if (!email || !password) {
        loginMsg.textContent = "اكتب الإيميل وكلمة المرور";
        return;
      }

      if (!ADMIN_EMAILS.includes(email)) {
        loginMsg.textContent = "هذا الإيميل غير مسموح له بدخول لوحة الأدمن";
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "admin.html";
      } catch (error) {
        loginMsg.textContent = "فشل تسجيل الدخول. تأكد من الإيميل وكلمة المرور ومن إنشاء الحساب داخل Firebase Auth";
      }
    });
  </script>
</body>
</html>
