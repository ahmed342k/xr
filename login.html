<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XR Admin Login</title>
  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent;
      font-family:Tahoma, Arial, sans-serif;
    }

    :root{
      --bg1:#08111f;
      --bg2:#0c1b30;
      --glass:rgba(255,255,255,.08);
      --glass-2:rgba(255,255,255,.05);
      --line:rgba(255,255,255,.14);
      --text:#f7fbff;
      --muted:#aac0d8;
      --blue:#2db6ff;
      --blue2:#117fff;
      --danger:#ff6b6b;
      --shadow:0 20px 60px rgba(0,0,0,.30);
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at top right, rgba(45,182,255,.18), transparent 24%),
        radial-gradient(circle at bottom left, rgba(45,182,255,.10), transparent 22%),
        linear-gradient(180deg,var(--bg2),var(--bg1));
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      overflow:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
        linear-gradient(135deg, rgba(255,255,255,.03), transparent 34%, rgba(45,182,255,.04));
      pointer-events:none;
    }

    .card{
      width:min(440px,100%);
      background:var(--glass);
      border:1px solid var(--line);
      border-radius:34px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      padding:30px 22px 24px;
      position:relative;
      overflow:hidden;
    }

    .card::after{
      content:"";
      position:absolute;
      width:220px;
      height:220px;
      left:-80px;
      bottom:-120px;
      background:radial-gradient(circle, rgba(45,182,255,.18), transparent 70%);
      pointer-events:none;
    }

    .hero{
      text-align:center;
      margin-bottom:24px;
    }

    .logo{
      width:110px;
      height:110px;
      margin:0 auto 12px;
      display:block;
      filter:drop-shadow(0 8px 24px rgba(45,182,255,.18));
    }

    .title{
      font-size:24px;
      font-weight:900;
      margin-bottom:6px;
    }

    .subtitle{
      color:var(--muted);
      font-size:15px;
      line-height:1.8;
      font-weight:700;
    }

    .field{
      margin-bottom:14px;
    }

    .input-wrap{
      position:relative;
    }

    .icon{
      position:absolute;
      top:50%;
      left:16px;
      transform:translateY(-50%);
      width:22px;
      height:22px;
      opacity:.95;
      pointer-events:none;
    }

    .input{
      width:100%;
      height:58px;
      border:none;
      outline:none;
      background:var(--glass-2);
      border:1.5px solid rgba(171,197,225,.20);
      border-radius:18px;
      color:var(--text);
      font-size:17px;
      padding:0 18px 0 50px;
      transition:.2s ease;
    }

    .input::placeholder{
      color:#bfd0e0;
    }

    .input:focus{
      border-color:rgba(45,182,255,.85);
      box-shadow:0 0 0 5px rgba(45,182,255,.12);
    }

    .submit-btn{
      width:100%;
      height:58px;
      border:none;
      border-radius:999px;
      background:linear-gradient(90deg,var(--blue2),var(--blue));
      color:#fff;
      font-size:20px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 16px 36px rgba(17,127,255,.24);
      transition:.2s ease;
      margin-top:4px;
    }

    .submit-btn:disabled{
      opacity:.7;
      cursor:not-allowed;
    }

    .notice{
      margin-top:14px;
      padding:14px 16px;
      border-radius:16px;
      font-size:15px;
      font-weight:800;
      line-height:1.8;
      display:none;
    }

    .notice.show{
      display:block;
    }

    .notice.error{
      background:rgba(255,107,107,.12);
      border:1px solid rgba(255,107,107,.24);
      color:#ffd7d7;
    }

    .notice.success{
      background:rgba(30,203,107,.12);
      border:1px solid rgba(30,203,107,.24);
      color:#dbffe9;
    }

    .footer{
      text-align:center;
      margin-top:18px;
      color:var(--muted);
      font-size:14px;
      line-height:1.8;
      font-weight:700;
    }

      .card{
        border-radius:28px;
        padding:24px 16px
