<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XR Admin</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-loading-screen{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:var(--bg, #f4f7fb);
      color:var(--text, #101828);
    }

    .auth-loading-card{
      width:min(460px,100%);
      background:var(--surface, #fff);
      border:1px solid var(--line, #e6eaf0);
      border-radius:24px;
      box-shadow:var(--shadow, 0 10px 30px rgba(16,24,40,.08));
      padding:22px;
      text-align:center;
    }

    .auth-loading-card h2{
      margin:0 0 10px;
      font-size:30px;
    }

    .auth-loading-card p{
      margin:0;
      color:var(--muted, #667085);
      line-height:1.9;
    }
  </style>
</head>
<body class="admin-page">
  <div id="authLoading" class="auth-loading-screen">
    <div class="auth-loading-card">
      <h2>جاري التحقق</h2>
      <p>لحظة، يتم التأكد من صلاحية الدخول إلى لوحة الأدمن.</p>
    </div>
  </div>

  <div class="admin-wrap" id="adminApp" style="display:none;">
    <div class="admin-card">
      <div class="admin-top">
        <div>
          <h1 class="admin-title">لوحة تحكم XR</h1>
          <p class="admin-sub">إضافة، تعديل، حذف المنتجات من Firebase مباشرة.</p>
          <p id="adminEmailInfo" class="admin-sub" style="margin-top:6px;"></p>
        </div>

        <div class="admin-actions">
          <a href="index.html" class="admin-btn-light">فتح المتجر</a>
          <button class="admin-btn-danger" id="logoutBtn">تسجيل الخروج</button>
        </div>
      </div>
    </div>

    <div class="admin-card">
      <div class="notice" id="noticeBox">تم الحفظ</div>

      <h2 id="formTitle">إضافة منتج</h2>

      <div class="admin-grid">
        <div class="field">
          <label for="name">اسم المنتج</label>
          <input type="text" id="name" />
        </div>

        <div class="field">
          <label for="category">الفئة</label>
          <select id="category">
            <option value="accessories">الإكسسوارات</option>
            <option value="electronics">الأجهزة الإلكترونية</option>
            <option value="home">الأدوات المنزلية</option>
            <option value="office">المستلزمات المكتبية</option>
            <option value="smart">الأجهزة الذكية</option>
          </select>
        </div>

        <div class="field">
          <label for="price">السعر الحالي</label>
          <input type="number" id="price" />
        </div>

        <div class="field">
          <label for="oldPrice">السعر قبل الخصم</label>
          <input type="number" id="oldPrice" />
        </div>

        <div class="field">
          <label for="badge">شارة المنتج</label>
          <input type="text" id="badge" placeholder="مثال: إلكتروني" />
        </div>

        <div class="field">
          <label for="mainImage">الصورة الرئيسية</label>
          <input type="file" id="mainImage" accept="image/*" />
        </div>

        <div class="field" style="grid-column:1/-1;">
          <label for="moreImages">صور إضافية</label>
          <input type="file" id="moreImages" accept="image/*" multiple />
        </div>
      </div>

      <div class="field">
        <label for="description">وصف المنتج</label>
        <textarea id="description"></textarea>
      </div>

      <div class="field">
        <label>معاينة الصور</label>
        <div class="preview-list" id="previewList"></div>
      </div>

      <div class="admin-actions">
        <button class="admin-btn" id="saveBtn">حفظ المنتج</button>
        <button class="admin-btn-light" id="resetBtn">تفريغ الحقول</button>
      </div>
    </div>

    <div class="admin-card">
      <h2>المنتجات الحالية</h2>
      <div class="admin-products" id="productsList">
        <div class="empty-box">جاري تحميل المنتجات...</div>
      </div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
