<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الادمن</title>

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial;
      background: #0f172a;
      color: #fff;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #1e293b;
      color: #fff;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .danger {
      background: #ef4444;
      color: #fff;
    }

    .preview-box {
      margin-top: 10px;
    }

    .preview-box img {
      width: 100%;
      border-radius: 10px;
    }

    .product {
      background: #1e293b;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .notice {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: #000;
      padding: 10px 20px;
      border-radius: 10px;
      display: none;
    }

    .notice.show {
      display: block;
    }
  </style>
</head>

<body>

<div class="container">

  <h1 id="formTitle">إضافة منتج</h1>

  <div id="adminEmailInfo"></div>

  <input id="name" placeholder="اسم المنتج">
  <input id="price" type="number" placeholder="السعر">
  <input id="oldPrice" type="number" placeholder="السعر قبل الخصم">
  
  <select id="category">
    <option value="electronics">الكترونيات</option>
    <option value="accessories">اكسسوارات</option>
  </select>

  <input id="badge" placeholder="شارة (جديد، عرض...)">

  <!-- 🔥 رفع صورة -->
  <input type="file" id="fileInput">
  <button id="uploadBtn">رفع صورة</button>

  <input id="mainImage" placeholder="رابط الصورة الرئيسية">

  <textarea id="moreImages" placeholder="روابط صور اضافية (كل رابط بسطر)"></textarea>

  <textarea id="description" placeholder="وصف المنتج"></textarea>

  <div id="previewList"></div>

  <button id="saveBtn">حفظ المنتج</button>
  <button id="resetBtn">تفريغ</button>
  <button id="logoutBtn" class="danger">تسجيل خروج</button>

  <h2>المنتجات الحالية</h2>
  <div id="productsList"></div>

</div>

<div id="noticeBox" class="notice"></div>

<!-- 🔥 ربط السكربت -->
<script type="module" src="admin.js"></script>

</body>
</html>
